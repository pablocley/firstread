# The one file the research agent edits (docs/13-lab.md section 6), plus ml/heads/train.py.
# The first run of a tag records the baseline; every later change is judged against the champion.
# On main: the champion of tag oct26b (edf10a6, lab/results/oct26b/).

[providers]
# "none" (tier 0 only), or an embedder from ml/sidecar/providers.py:
# potion-ml-128m, e5-small, mmbert-small, harrier-270m.
embedder = "e5-small"
# The configuration, from the embedder's entry in the registry; empty or 0 takes its default.
# runtime: "torch", "onnx" (e5-small) or "numpy" (potion); precision: "fp32" or "int8";
# max_tokens: input token limit; threads: compute threads in the sidecar; ort_arena: onnxruntime's
# memory arena and memory-pattern planning (memory and speed only, not the vectors); tokenizer:
# "hf" or "sentencepiece" (onnx, e5-small).
runtime = "onnx"
precision = "int8"
max_tokens = 192
threads = 0
ort_arena = true
tokenizer = "sentencepiece"

[render]
# Provider text version. Only "r1" (firstread render-batch defaults) is rendered and embedded.
version = "r1"

[heads]
# Logistic head on the embedding, per question.
C = 1.0

[combiner]
# Logistic combiner over tier-0 facts and head logits, trained on the calib split.
C = 4.0
# 0 is an L2 penalty (lbfgs), 1 an L1 penalty (saga), in between elastic net.
l1_ratio = 1.0
# Feature names or prefixes to leave out, e.g. ["links.", "auth."].
disabled = []
# Mailbox memory (mailbox.*): "joint" fits it with everything else; "residual" fits the rest
# without memory first, then memory on top of it without an intercept and without the absence
# facts, so mail from a sender, domain and thread the mailbox does not know is decided exactly as
# without memory. Only the learning test (lab/harness/learning.py) produces mailbox.* inputs.
memory = "residual"

[thresholds]
# "cost" derives the Bayes threshold from the cost table: P(junk) >= c_fp / (c_fp + c_fn).
junk = "cost"
