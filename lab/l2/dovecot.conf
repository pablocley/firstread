protocols = lmtp imap
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
}
service pop3-login {
  inet_listener pop3 {
    port = 0
  }
}
service submission-login {
  inet_listener submission {
    port = 0
  }
}
base_dir = /srv/l2/run
listen = 127.0.0.1
log_path = /srv/l2/dovecot.log
ssl = no
mail_location = maildir:/srv/l2/mail/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 990
passdb {
  driver = static
  args = nopassword=y
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/l2/mail/%n
}
namespace inbox {
  inbox = yes
  mailbox Junk {
    auto = create
    special_use = \Junk
  }
  mailbox Trash {
    auto = create
    special_use = \Trash
  }
  mailbox Sent {
    auto = create
    special_use = \Sent
  }
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
# Hook D: the owner's moves into and out of Junk, and copies reaching Sent, run the report
# scripts (IMAPSieve, RFC 6785), which pipe the message to firstread-feedback.
protocol imap {
  mail_plugins = $mail_plugins imap_sieve
}
service lmtp {
  unix_listener lmtp {
    mode = 0666
  }
}
plugin {
  sieve = file:/srv/l2/mail/%n/sieve;active=/srv/l2/mail/%n/active.sieve
  sieve_before = /srv/l2/sieve/before.sieve
  sieve_after = /srv/l2/sieve/after.sieve
  sieve_plugins = sieve_extprograms sieve_imapsieve
  sieve_global_extensions = +vnd.dovecot.filter +editheader +vnd.dovecot.pipe +vnd.dovecot.environment
  sieve_filter_bin_dir = /srv/l2/bin
  sieve_filter_exec_timeout = 3s
  sieve_pipe_bin_dir = /srv/l2/pipe-bin
  # into Junk
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/srv/l2/sieve/report-junk.sieve
  # out of Junk, to anywhere
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/srv/l2/sieve/report-not-junk.sieve
  # a copy reaching Sent
  imapsieve_mailbox3_name = Sent
  imapsieve_mailbox3_causes = APPEND COPY
  imapsieve_mailbox3_before = file:/srv/l2/sieve/report-sent.sieve
}
