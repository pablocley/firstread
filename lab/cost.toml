# Set by the owner before the first run; the agent never edits this file (docs/13-lab.md section 5).
# Set 2026-10-26 from the owner's answers: one spam left in the inbox costs 1; one legitimate mail
# (business, personal, a mailing list you're on) in Junk costs 100. Later the same day the owner
# made latency and footprint keep axes next to quality ([keep] below).
# Not asked yet, set equal to spam for now and flagged: phishing and fraud left in the inbox.
# nan means "not set": the harness refuses to start while any value it needs is nan. Actions not
# reachable in v0 (inbox_marked, later) stay nan.

[run]
experiment_budget_minutes = 15
sealed_queries_per_tag = 1
reference_machine = "cloud sandbox, 2 vCPU, 7 GB RAM (see docs/measurements/2026-10-26-lab-v0.md)"

[keep]
# The three-axis keep rule (lab/program.md), set 2026-10-26 from the owner's instruction: keep a
# run only when one or more of quality, latency and footprint improves and none is worse.
# The tolerances below were set by the build agent, not by the owner (FLAG); they say what
# "beyond noise" and "not worse" mean.
#
# Quality: improve = the paired bootstrap CI95 of the primary-slice cost difference lies below 0;
# worse = any legitimate message newly filed in Junk (any slice), a slice significantly worse, the
# CI95 above 0, or a point difference above this tolerance (3.1 per 1,000 is three more missed
# spam messages on the 967 primary dev messages).
quality_tolerance_per_1k = 3.1
# Latency (filter wall time per email) and CPU (per email): ratio of means against the champion,
# measured interleaved on the same messages. improve = CI95 below 1 and ratio at most *_improve;
# worse = CI95 above 1, or ratio at least *_worse.
latency_improve = 0.95
latency_worse = 1.05
cpu_improve = 0.95
cpu_worse = 1.05
# Peak resident memory of sidecar plus daemon, as a ratio.
ram_improve = 0.95
ram_worse = 1.03
# Timing pass: messages measured (after warm-up), and the share of a core that other processes or
# the hypervisor may take during it before latency and CPU count as unmeasured.
timing_messages = 200
timing_warmup = 10
max_other_cpu_cores = 0.15

[cost.phishing]
inbox = 1.0                       # FLAG: not asked; equal to spam for now
inbox_marked = nan
later = nan
junk = 0.0

[cost.fraud]
inbox = 1.0                       # FLAG: not asked; equal to spam for now
inbox_marked = nan
later = nan
junk = 0.0

[cost.junk]
inbox = 1.0
inbox_marked = nan
later = nan
junk = 0.0

[cost.bulk_wanted]
inbox = 0.0
inbox_marked = nan
later = nan
junk = 100.0

[cost.personal_or_business]
inbox = 0.0
inbox_marked = nan
later = nan
junk = 100.0

[cost.machine]
inbox = 0.0
inbox_marked = nan
later = nan
junk = 100.0
